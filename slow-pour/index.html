<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slow Pour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Marcellus&display=swap" rel="stylesheet">
<style>
/* Layout idea: a dye bench at dusk. Wordmark and level on top, vials standing on
   wooden shelves in the middle, a quiet row of tools at the bottom. One world, one theme. */
:root {
  color-scheme: dark;
  --ink: #211e2e;          /* bench background */
  --ink-deep: #17151f;     /* vignette edge */
  --plank: #4b4460;        /* shelf */
  --paper: #efe8de;        /* text */
  --dust: #a49fb6;         /* muted text */
  --glow: #f2b880;         /* candle accent */
  --glass: rgba(255, 255, 255, .34);
  --font-display: "Marcellus", "Iowan Old Style", Georgia, serif;
  --font-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --gap: 8px;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background:
    radial-gradient(120% 70% at 50% 108%, rgba(242, 184, 128, .16), transparent 60%),
    radial-gradient(100% 100% at 50% 40%, var(--ink), var(--ink-deep));
  background-color: var(--ink);
  color: var(--paper);
  font-family: var(--font-body);
  font-size: 15px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--glow); outline-offset: 3px; }

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 16px 20px 4px;
  flex-wrap: wrap;
}
.wordmark {
  font-family: var(--font-display);
  font-size: 28px;
  letter-spacing: .04em;
  margin: 0;
  font-weight: 400;
}
.wordmark i { font-style: normal; color: var(--glow); }
.tabs { position: relative; display: flex; padding: 3px; border-radius: 999px; background: rgba(255, 255, 255, .06); }
.tabs::before {          /* the pill that slides to the chosen mode */
  content: "";
  position: absolute;
  top: 3px; bottom: 3px;
  left: var(--pill-x, 3px);
  width: var(--pill-w, 0px);
  border-radius: 999px;
  background: var(--glow);
  box-shadow: 0 0 18px -2px rgba(242, 184, 128, .55);
  transition: left .34s cubic-bezier(.3, 1.2, .4, 1), width .34s cubic-bezier(.3, 1.2, .4, 1);
}
.tabs button {
  padding: 7px 14px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--dust);
  font-weight: 600;
  position: relative;
  transition: color .25s ease;
}
.tabs button[aria-selected="true"] { color: #2a2030; }
.status {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 8px;
  padding: 8px 20px 0;
}
.back {
  justify-self: start;
  padding: 6px 12px;
  border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, .16);
  background: transparent;
  color: var(--dust);
}
.levelnav { display: flex; align-items: center; gap: 6px; }
.levelnav button {
  width: 32px; height: 32px;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, .16);
  background: transparent;
  font-size: 17px; line-height: 1;
}
.levelnav button:disabled { opacity: .25; cursor: default; }
.levelnav .label {
  font-family: var(--font-display);
  font-size: 19px;
  min-width: 84px;
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.pours { justify-self: end; color: var(--dust); font-variant-numeric: tabular-nums; text-align: right; line-height: 1.25; }
.pours .clock { display: block; font-family: var(--font-display); font-size: 19px; color: var(--paper); }
.pours.low, .pours .clock.low { color: #ef6f6c; }

/* tier picker */
.tiers { display: grid; grid-template-columns: repeat(2, minmax(0, 300px)); gap: 16px; width: 100%; justify-content: center; }
.tier {                  /* each tier glows in its own colour: tinted face, coloured light behind */
  text-align: left;
  padding: 16px 18px 14px;
  border-radius: 14px;
  border: 1px solid color-mix(in srgb, var(--stripe) 45%, transparent);
  background: linear-gradient(155deg, color-mix(in srgb, var(--stripe) 30%, #221f30), color-mix(in srgb, var(--stripe) 11%, #1c1a28));
  box-shadow:
    0 12px 26px -14px color-mix(in srgb, var(--stripe) 55%, transparent),
    0 0 16px -8px color-mix(in srgb, var(--stripe) 60%, transparent),
    inset 0 1px 0 color-mix(in srgb, var(--stripe) 35%, transparent);
  display: flex; flex-direction: column; gap: 6px;
  transition: transform .22s cubic-bezier(.3, 1.4, .5, 1), box-shadow .22s ease, filter .22s ease;
  animation: arrive .5s cubic-bezier(.2, .8, .3, 1) calc(var(--i) * 70ms) backwards, breathe 3.6s ease-in-out calc(var(--i) * .5s) infinite;
}
.tier:hover, .tier:focus-visible {
  transform: translateY(-3px);
  filter: brightness(1.08);
  box-shadow:
    0 14px 30px -12px color-mix(in srgb, var(--stripe) 75%, transparent),
    0 0 22px -6px color-mix(in srgb, var(--stripe) 80%, transparent),
    inset 0 1px 0 color-mix(in srgb, var(--stripe) 50%, transparent);
}
.tier:active { transform: translateY(0) scale(.985); }
.tier b { font-family: var(--font-display); font-weight: 400; font-size: 23px; color: color-mix(in srgb, var(--stripe) 72%, white); text-shadow: 0 0 14px color-mix(in srgb, var(--stripe) 35%, transparent); }
.tier span { color: color-mix(in srgb, var(--stripe) 22%, var(--paper)); line-height: 1.35; }
.tier em { font-style: normal; font-weight: 600; color: color-mix(in srgb, var(--stripe) 80%, white); font-variant-numeric: tabular-nums; }
@keyframes breathe { 50% { filter: brightness(1.05) saturate(1.08); } }
.lbopen {
  grid-column: 1 / -1;
  justify-self: center;
  padding: 11px 22px;
  border-radius: 999px;
  border: 1px solid rgba(242, 184, 128, .5);
  background: rgba(242, 184, 128, .1);
  color: var(--glow);
  font-weight: 600;
}
.lbopen:hover { background: rgba(242, 184, 128, .18); }
.lb { width: min(100%, 520px); max-height: 100%; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.lb-top { display: flex; align-items: center; gap: 12px; }
.lb-top h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 24px; }
.lb-name { display: flex; gap: 8px; }
.lb-name input {
  flex: 1; min-width: 0;
  padding: 10px 14px;
  border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, .18);
  background: rgba(255, 255, 255, .06);
  color: var(--paper);
  font: inherit;
  user-select: text;
}
.lb-name input::placeholder { color: var(--dust); }
.lb-name button, .lb-list button {
  padding: 10px 16px; border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, .16);
  background: rgba(255, 255, 255, .06); font-weight: 500;
}
.lb-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.lb-chips button {
  padding: 7px 14px; border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--stripe) 45%, transparent);
  background: transparent;
  color: color-mix(in srgb, var(--stripe) 75%, white);
  font-weight: 600;
}
.lb-chips button[aria-pressed="true"] { background: color-mix(in srgb, var(--stripe) 28%, #221f30); box-shadow: 0 0 14px -6px var(--stripe); }
.lb-list { flex: 1; min-height: 120px; overflow-y: auto; border-radius: 12px; border: 1px solid rgba(255, 255, 255, .1); background: rgba(255, 255, 255, .03); }
.lb-list p { margin: 0; padding: 22px 18px; color: var(--dust); text-align: center; line-height: 1.5; }
.lb-list ol { list-style: none; margin: 0; padding: 4px 0; }
.lb-list li {
  display: grid; grid-template-columns: 34px minmax(0, 1fr) auto auto; gap: 12px; align-items: baseline;
  padding: 9px 16px;
  font-variant-numeric: tabular-nums;
}
.lb-list li + li { border-top: 1px solid rgba(255, 255, 255, .06); }
.lb-list li.me { background: rgba(242, 184, 128, .1); }
.lb-list .rank { font-family: var(--font-display); font-size: 18px; color: var(--glow); }
.lb-list .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.lb-list .num { color: var(--dust); white-space: nowrap; }
.lb-list .num b { color: var(--paper); font-weight: 600; }
@media (max-width: 560px) { .tiers { grid-template-columns: minmax(0, 340px); } .tier { padding: 12px 16px 11px; } }

.howto {
  margin: 2px 20px 0;
  color: var(--dust);
  text-align: center;
  min-height: 1.4em;
}

main {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 30px;
  padding: 8px 20px 14px;
  --tw: min(
    clamp(26px, calc((100vw - 40px - (var(--cols, 5) - 1) * var(--gap)) / var(--cols, 5)), 60px),
    calc(var(--availh, 50vh) / 3.4)
  );
}
.row {
  position: relative;
  display: flex;
  gap: var(--gap);
  align-items: flex-end;
  justify-content: center;
  padding-top: 26px;
}
.row::after {            /* the shelf */
  content: "";
  position: absolute;
  left: -14px; right: -14px; bottom: -7px;
  height: 7px;
  border-radius: 2px 2px 4px 4px;
  background: linear-gradient(var(--plank), #2e2a3d);
  box-shadow: 0 10px 18px rgba(0, 0, 0, .35);
}

.tube {
  position: relative;
  width: var(--tw);
  height: calc(var(--tw) * 3.4);
  padding: 0;
  border: 2px solid var(--glass);
  border-top-color: transparent;
  border-radius: 4px 4px calc(var(--tw) / 2) calc(var(--tw) / 2);
  background: rgba(255, 255, 255, .035);
  transform-origin: 50% 50%;
  cursor: grab;
  touch-action: none;
  will-change: transform;
}
.tube::before {          /* lip of the vial */
  content: "";
  position: absolute;
  left: -5px; right: -5px; top: -3px;
  height: 5px;
  border: 2px solid var(--glass);
  border-radius: 4px;
}
.tube::after {           /* glass highlight */
  content: "";
  position: absolute;
  left: 16%; top: 8%; bottom: 14%;
  width: 12%;
  border-radius: 99px;
  background: linear-gradient(rgba(255, 255, 255, .34), rgba(255, 255, 255, .04));
  pointer-events: none;
}
.tube.dragging { cursor: grabbing; filter: drop-shadow(0 16px 14px rgba(0, 0, 0, .4)); }
.tube.target { box-shadow: 0 0 0 4px rgba(242, 184, 128, .55), 0 0 26px rgba(242, 184, 128, .35); }
.tube.hint-from { animation: nudge 1.5s ease; }
.tube.hint-to { animation: ring 1.5s ease; }
.tube.cheer { animation: cheer .6s cubic-bezier(.3, 1.6, .5, 1) calc(var(--i) * 55ms); }
main.arrive .tube { animation: arrive .5s cubic-bezier(.2, .8, .3, 1) calc(var(--i) * 40ms) backwards; }
main { transition: opacity .18s ease, transform .18s ease; }
main.leaving { opacity: 0; transform: translate(var(--slide, 0px), var(--drop, 8px)); }
main.enter { animation: enter .36s cubic-bezier(.2, .8, .3, 1); }
@keyframes enter { from { opacity: 0; transform: translateX(var(--from, 0px)); } }
@keyframes nudge { 0%, 100% { transform: none; } 25%, 70% { transform: translateY(-16px); } }
@keyframes ring {
  0%, 100% { box-shadow: 0 0 0 0 rgba(242, 184, 128, 0); }
  40%, 75% { box-shadow: 0 0 0 5px rgba(242, 184, 128, .55); }
}
@keyframes cheer { 40% { transform: translateY(-14px); } }
@keyframes arrive { from { opacity: 0; transform: translateY(22px); } }

.liquid {                /* the inside of the glass: clips whatever the liquid does */
  position: absolute;
  inset: 0;
  overflow: hidden;
  border-radius: 0 0 calc(var(--tw) / 2 - 2px) calc(var(--tw) / 2 - 2px);
}
.level {                 /* the liquid itself: counter-rotated so its surface stays flat */
  position: absolute;
  left: -300%; right: -300%; bottom: 0;
  height: 88%;
  display: flex;
  flex-direction: column-reverse;
  transform-origin: 50% 100%;
}
.sump { position: absolute; left: 0; right: 0; top: 100%; height: 130%; }
.slot {
  flex: none;
  height: 0;
  overflow: hidden;
  display: grid;
  place-items: center;
  font-size: calc(var(--tw) * .34);
  color: rgba(20, 16, 30, .62);
  transition: height var(--pour-ms, 240ms) cubic-bezier(.45, 0, .55, 1);
}
.slot.on { box-shadow: inset 0 -1px 0 rgba(0, 0, 0, .08); }
.slot.top { box-shadow: inset 0 3px 0 rgba(255, 255, 255, .26), inset 0 -1px 0 rgba(0, 0, 0, .08); }
body.marks .slot.on::after { content: attr(data-g); }

.stream {                /* the liquid falling between vials */
  position: fixed;
  z-index: 4;
  border-radius: 99px 99px 3px 3px;
  transform: scaleY(0);
  transform-origin: 50% 0;
  transition: transform .12s ease-in;
  pointer-events: none;
  box-shadow: inset 2px 0 0 rgba(255, 255, 255, .22);
}

.cork {
  position: absolute;
  left: 50%; top: -15px;
  width: 62%; height: 15px;
  margin-left: -31%;
  border-radius: 4px 4px 2px 2px;
  background: linear-gradient(90deg, #a87b52, #c99a6b 45%, #9a6d47);
  opacity: 0;
  transform: translateY(-14px);
  transition: opacity .25s ease, transform .35s cubic-bezier(.3, 1.5, .5, 1);
  pointer-events: none;
}
.tube.done .cork { opacity: 1; transform: none; transition-delay: var(--pour-ms, 240ms); }

footer { padding: 6px 16px 18px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.tools, .winbar { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; align-items: center; }
.tools button, .winbar button {
  padding: 10px 16px;
  border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, .16);
  background: rgba(255, 255, 255, .05);
  font-weight: 500;
}
.tools button:hover:not(:disabled) { background: rgba(255, 255, 255, .1); }
.tools button:disabled { opacity: .3; cursor: default; }
.tools .quiet { border-color: transparent; background: transparent; color: var(--dust); padding: 10px 10px; }
.winbar { gap: 16px; animation: rise .45s cubic-bezier(.2, .8, .3, 1); }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } }
.winbar p { margin: 0; font-family: var(--font-display); font-size: 20px; text-wrap: balance; text-align: center; }
.winbar.lost button { background: rgba(255, 255, 255, .1); color: var(--paper); border-color: rgba(255, 255, 255, .2); }
.winbar button { background: var(--glow); color: #2a2030; border-color: transparent; font-weight: 600; padding: 12px 22px; }
[hidden] { display: none !important; }
.toast { color: var(--glow); min-height: 1.4em; text-align: center; margin: 0; }

@media (max-width: 420px) {
  .wordmark { font-size: 23px; }
  .levelnav .label { min-width: 70px; font-size: 17px; }
  .tools button { padding: 9px 13px; }
  .tabs button { padding: 6px 11px; }
  .status { padding: 8px 14px 0; gap: 4px; }
  .back { padding: 6px 9px; }
}
@media (prefers-reduced-motion: reduce) {
  .slot, .cork, main, .level { transition: none !important; }
  .tube, main.arrive .tube, .winbar, .tier, main.enter { animation: none !important; }
  .tabs::before, .tier { transition: none; }
}
</style>
</head>
<body>
<header>
  <h1 class="wordmark">Slow <i>Pour</i></h1>
  <div class="tabs" role="tablist" aria-label="Game mode">
    <button role="tab" id="tabCasual">Casual</button>
    <button role="tab" id="tabComp">Competitive</button>
  </div>
</header>
<div class="status" id="status">
  <button id="tiersBtn" class="back">&#8249; Tiers</button>
  <div class="levelnav">
    <button id="prev" aria-label="Previous level">&#8249;</button>
    <span class="label" id="levelLabel">Level 1</span>
    <button id="next" aria-label="Next unlocked level">&#8250;</button>
  </div>
  <div class="pours" id="pours"></div>
</div>
<p class="howto" id="howto"></p>

<main id="board"></main>

<footer>
  <p class="toast" id="toast" role="status"></p>
  <div class="tools" id="tools">
    <button id="undo">Undo</button>
    <button id="hint">Hint</button>
    <button id="extra">Add a vial</button>
    <button id="restart">Start over</button>
    <button id="sound" class="quiet" aria-pressed="true">Sound on</button>
    <button id="marks" class="quiet" aria-pressed="false">Symbols off</button>
  </div>
  <div class="winbar" id="winbar" hidden>
    <p id="winText"></p>
    <button id="nextLevel">Next level</button>
  </div>
</footer>

<script>
/* LEADERBOARD SETUP: paste your Supabase project URL and publishable key between the quotes.
   Both are meant to be public. Leave them empty and the game still works, without a leaderboard. */
const SUPABASE_URL = "https://oxiuahcszfwghftvbgzc.supabase.co";
const SUPABASE_KEY = "sb_publishable_g-hZgNwUqM_wbjPjUgN8Nw_PYdF7yUJ";

const CAP = 4;
const COLORS = [
  ["coral", "#ef6f6c", "●"], ["amber", "#f4a340", "▲"], ["lemon", "#f3de6b", "■"],
  ["leaf", "#7fc96b", "◆"], ["pine", "#2f9e7a", "✚"], ["aqua", "#5fd3d0", "★"],
  ["sky", "#4c9be8", "♥"], ["indigo", "#5b62d6", "☾"], ["violet", "#a56be0", "✿"],
  ["rose", "#ee7fb5", "◐"], ["clay", "#b5714a", "✕"], ["mist", "#cfd3dc", "○"]
];

/* CORE-START: pure game logic */
function rng(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffle(arr, r) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(r() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function topRun(t) {
  let n = 0;
  for (let i = t.length - 1; i >= 0 && t[i] === t[t.length - 1]; i--) n++;
  return n;
}
function isDone(t) { return t.length === CAP && t.every(c => c === t[0]); }
function solved(tubes) { return tubes.every(t => !t.length || isDone(t)); }
/* how many units would move from i to j (0 = not allowed) */
function canPour(tubes, i, j) {
  if (i === j) return 0;
  const a = tubes[i], b = tubes[j];
  if (!a.length || b.length >= CAP) return 0;
  if (b.length && b[b.length - 1] !== a[a.length - 1]) return 0;
  return Math.min(topRun(a), CAP - b.length);
}
function keyOf(tubes) { return tubes.map(t => t.join(".")).sort().join("|"); }
function solve(start, limit) {
  const tubes = start.map(t => t.slice());
  const seen = new Set();
  const path = [];
  let nodes = 0;
  function rec() {
    if (solved(tubes)) return true;
    if (++nodes > limit) return false;
    const k = keyOf(tubes);
    if (seen.has(k)) return false;
    seen.add(k);
    const mv = [];
    for (let i = 0; i < tubes.length; i++) {
      const a = tubes[i];
      if (!a.length || isDone(a)) continue;
      const run = topRun(a), uniform = run === a.length;
      let usedEmpty = false;
      for (let j = 0; j < tubes.length; j++) {
        if (j === i) continue;
        const b = tubes[j];
        if (b.length >= CAP) continue;
        if (!b.length) {
          if (uniform || usedEmpty) continue;
          usedEmpty = true;
          mv.push([i, j, run, 1]);
        } else if (b[b.length - 1] === a[a.length - 1]) {
          const n = Math.min(run, CAP - b.length);
          mv.push([i, j, n, n === run ? 0 : 2]);
        }
      }
    }
    mv.sort((x, y) => x[3] - y[3]);
    for (const [i, j, n] of mv) {
      for (let q = 0; q < n; q++) tubes[j].push(tubes[i].pop());
      path.push([i, j]);
      if (rec()) return true;
      path.pop();
      for (let q = 0; q < n; q++) tubes[i].push(tubes[j].pop());
    }
    return false;
  }
  return rec() ? path : null;
}
function colorsFor(level) {
  if (level <= 1) return 3;
  if (level <= 3) return 4;
  if (level <= 6) return 5;
  if (level <= 10) return 6;
  if (level <= 16) return 7;
  if (level <= 24) return 8;
  if (level <= 34) return 9;
  if (level <= 46) return 10;
  if (level <= 60) return 11;
  return 9 + (level * 7) % 4;
}
/* the same level number always gives the same puzzle, and every puzzle is checked solvable */
function makeLevel(level) { return genPuzzle(colorsFor(level), level * 9973 + 7); }
function genPuzzle(n, seed) {
  let tubes = null;
  for (let attempt = 0; attempt < 120; attempt++) {
    const r = rng(seed + attempt * 131);
    const pal = shuffle(COLORS.map((_, i) => i), r).slice(0, n);
    const units = [];
    for (const c of pal) for (let q = 0; q < CAP; q++) units.push(c);
    shuffle(units, r);
    tubes = [];
    for (let i = 0; i < n; i++) tubes.push(units.slice(i * CAP, i * CAP + CAP));
    tubes.push([], []);
    if (tubes.some(isDone)) continue;
    const sol = solve(tubes, 30000);
    if (sol && sol.length >= n + 1) return tubes;
  }
  return tubes;
}
/* a short solution: keep searching for one with fewer pours until the budget runs out */
function shortest(start, budget) {
  let best = solve(start, 30000);
  if (!best) return null;
  best = best.slice();

  }
  setT(el, dx, dy - 12, Math.max(-12, Math.min(12, dx * .07)), 0);
  const me = drag.homes[drag.i], cx = me.x + me.w / 2 + dx, cy = me.y + me.h / 2 + dy - 12;
  let best = -1, bd = 1e9;
  drag.homes.forEach((h, j) => {
    if (j === drag.i || tubeEls[j]._busy) return;
    const ax = Math.abs(h.x + h.w / 2 - cx), ay = Math.abs(h.y + h.h / 2 - cy);
    if (ax < h.w * .95 && ay < h.h * .8 && ax + ay * .3 < bd) { bd = ax + ay * .3; best = j; }
  });
  if (best >= 0 && !canPour(S.tubes, drag.i, best)) best = -1;
  if (best !== drag.target) {
    if (drag.target >= 0) tubeEls[drag.target].classList.remove("target");
    drag.target = best;
    if (best >= 0) tubeEls[best].classList.add("target");
  }
}
function onUp(e, cancelled) {
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag, el = tubeEls[d.i];
  drag = null;
  if (d.target >= 0) tubeEls[d.target].classList.remove("target");
  if (!d.on) { if (!cancelled) tap(d.i); return; }
  el.classList.remove("dragging");
  if (!cancelled && d.target >= 0 && !tubeEls[d.target]._busy && !locked()) {
    const n = canPour(S.tubes, d.i, d.target);
    if (n) { pour(d.i, d.target, n); return; }
  }
  setT(el, 0, 0, 0, 320, SPRING);          /* dropped nowhere useful: glide back to the shelf */
  setTimeout(() => { if (!el._busy && !el.classList.contains("dragging")) el.style.zIndex = ""; }, 320);
}

/* ---------- pouring ---------- */
function pour(from, to, n) {
  if (sel === to) setT(tubeEls[to], 0, 0, 0, 0);
  sel = -1;
  const fromLen = S.tubes[from].length, toLen = S.tubes[to].length;
  S.history.push({ tubes: S.tubes.map(t => t.slice()), extra: S.extra });
  if (S.history.length > 300) S.history.shift();
  const color = S.tubes[from][fromLen - 1];
  for (let q = 0; q < n; q++) S.tubes[to].push(S.tubes[from].pop());
  S.moves++;
  save();
  chrome();
  const src = tubeEls[from], dst = tubeEls[to], g = gen;
  if (calm()) { drawTube(from, 0); drawTube(to, 0); note(SCALE[color], 0, .55, .07); settle(to, color); return; }

  src._busy = dst._busy = true; busy++;
  src.classList.remove("cheer", "hint-from", "hint-to");
  const hs = home(src), hd = home(dst), cx = hd.x + hd.w / 2;
  const unit = dst._lv.offsetHeight / CAP;
  /* the angle at which liquid filled to a given height just reaches the lip */
  const lipAngle = len => Math.min(84, Math.atan2(2 * (hs.h - len * unit), hs.w) * 180 / Math.PI);
  const a1 = lipAngle(fromLen) + 1, a2 = lipAngle(fromLen - n) + 2;
  const reach = hs.h * Math.sin(a2 * Math.PI / 180) + hs.w * .6;
  /* the vial comes in from the side it lives on, unless it would leave the screen */
  let right = Math.abs(hs.x - hd.x) < 4 ? cx > innerWidth / 2 : hs.x < hd.x;
  if (right && cx - reach < 0 && cx + reach <= innerWidth) right = false;
  else if (!right && cx + reach > innerWidth && cx - reach >= 0) right = true;
  const dir = right ? 1 : -1;
  const sw = Math.max(4, hs.w * .15);
  /* hold the pouring corner of the mouth just above the middle of the target */
  const Wx = cx - dir * sw * .5;
  const Wy = Math.max(hs.w * 1.2, hd.y - 18 - .45 * hs.h * Math.cos(a1 * Math.PI / 180));
  const px = (right ? hs.w : 0) - hs.w / 2, py = -hs.h / 2;
  const tx = Wx - hs.x - hs.w / 2 - px, ty = Wy - hs.y - hs.h / 2 - py;
  src.style.zIndex = 5;
  setPose(src, tx, ty, px, py, dir * a1, 280, GLIDE);

  const surface = hd.y + hd.h - 2 - toLen * unit;
  const stream = document.createElement("div");
  stream.className = "stream";
  stream.style.cssText = "left:" + (cx - sw / 2) + "px;top:" + Wy + "px;width:" + sw + "px;height:" + (surface - Wy + (toLen ? 3 : -5)) + "px;background:" + COLORS[color][1];
  document.body.appendChild(stream);

  const D = 240 + 150 * n;
  const later = (ms, fn) => setTimeout(() => { if (g === gen) fn(); else stream.remove(); }, ms);
  later(250, () => { stream.style.transform = "scaleY(1)"; });
  later(340, () => {
    drawTube(from, D); drawTube(to, D);        /* one level falls while the other rises */
    setPose(src, tx, ty, px, py, dir * a2, D, FLOW);   /* and the vial tips further as it empties */
    note(SCALE[color], 0, .3 + D / 1000, .07);
  });
  later(340 + D - 60, () => { stream.style.transformOrigin = "50% 100%"; stream.style.transform = "scaleY(0)"; });
  later(340 + D + 70, () => { stream.remove(); setT(src, 0, 0, 0, 300, GLIDE); });
  later(340 + D + 370, () => {
    src.style.zIndex = ""; src._busy = dst._busy = false; busy--;
    settle(to, color);
  });
}
function lose(why) {
  S.lost = why;
  note(196, 0, .9, .06); note(155.6, .18, 1.1, .06);
  chrome(); save();
  setTimeout(() => $("nextLevel").focus(), 300);
}
function settle(to, color) {
  if (isDone(S.tubes[to])) { note(SCALE[color] * 1.5, 0, .7, .06); note(SCALE[color] * 2, .14, .9, .05); }
  if (S.lost) return;
  if (solved(S.tubes)) {
    if (S.won) return;
    S.won = true;
    if (comp() && S.level + 1 > S.max) G.spare[S.tier] = (G.spare[S.tier] || 0) + Math.max(0, S.limit - S.moves);   /* first solve only */
    S.max = Math.max(S.max, S.level + 1);
    if (comp()) setTimeout(submit, 0);
    [523.3, 659.3, 784, 1046.5].forEach((f, k) => note(f, .3 + k * .14, 1.1, .06));
    tubeEls.forEach((el, i) => { if (S.tubes[i].length) { setT(el, 0, 0, 0, 0); el.classList.add("cheer"); } });
    chrome(); save();
    setTimeout(() => $("nextLevel").focus(), 500);
  } else if (busy) {
    return;
  } else if (S.limit && S.moves >= S.limit) {
    lose("pours");
  } else if (!anyMove()) {
    toast(comp() ? "Nothing left to pour. Undo a step, or start over." : "No pours left. Undo a step, or add a vial.");
  }
}
function anyMove() {
  for (let i = 0; i < S.tubes.length; i++)
    for (let j = 0; j < S.tubes.length; j++)
      if (canPour(S.tubes, i, j)) return true;
  return false;
}
/* the clock only exists on Expert; it runs from the first pour and pauses when the page is hidden */
setInterval(() => {
  const now = Date.now(), dt = Math.min(.5, (now - lastTick) / 1000);
  lastTick = now;
  if (!S || !S.time || !S.moves || S.won || S.lost || document.hidden) return;
  S.elapsed += dt;
  if (S.elapsed >= S.time && !solved(S.tubes)) { S.elapsed = S.time; lose("time"); return; }
  counter();
  if (now - lastSave > 4000) save();
}, 250);

/* ---------- moving between puzzles, tiers and modes ---------- */
/* dir: 1 slides the board off to the left and the new one in from the right (to Competitive),
   -1 the other way (to Casual), 0 a plain fade for puzzle and tier changes */
function swap(change, dir) {
  dir = dir || 0;
  toast("");
  const g = ++gen;
  const run = () => {
    if (g !== gen) return;
    change();
    current();
    show(true);
    board.classList.remove("leaving", "enter");
    if (dir && !calm()) {
      board.style.setProperty("--from", dir * 56 + "px");
      void board.offsetWidth;
      board.classList.add("enter");
    }
    save();
  };
  if (calm()) { run(); return; }
  board.style.setProperty("--slide", -dir * 56 + "px");
  board.style.setProperty("--drop", dir ? "0px" : "8px");
  if (dir) { G.mode = dir > 0 ? "comp" : "casual"; pill(); $("tabCasual").setAttribute("aria-selected", dir < 0); $("tabComp").setAttribute("aria-selected", dir > 0); G.mode = dir > 0 ? "casual" : "comp"; }
  board.classList.add("leaving");
  setTimeout(run, 190);
}
function go(level) {
  swap(() => {
    const g = fresh(level, S, S.tier);
    if (g.tier == null) G.casual = g; else G.comp[g.tier] = g;
  });
}

$("undo").addEventListener("click", () => {
  if (busy || !S.history.length) return;
  const h = S.history.pop();
  const rebuilt = h.tubes.length !== S.tubes.length;
  S.tubes = h.tubes; S.extra = h.extra;
  if (!comp() && !rebuilt) S.moves = Math.max(0, S.moves - 1);
  toast("");
  if (rebuilt) show(false);
  else { select(-1); S.tubes.forEach((_, i) => drawTube(i, 280)); chrome(); }
  save();
});
$("restart").addEventListener("click", () => go(S.level));
$("extra").addEventListener("click", () => {
  if (S.extra || busy || comp()) return;
  S.history.push({ tubes: S.tubes.map(t => t.slice()), extra: false });
  S.tubes.push([]); S.extra = true;
  show(false);
  toast("One spare vial added for this level.");
  save();
});
$("hint").addEventListener("click", () => {
  if (busy || comp()) return;
  const sol = solve(S.tubes, 60000);
  if (!sol || !sol.length) { toast("This position looks stuck. Undo a few pours, or add a vial."); return; }
  const [a, b] = sol[0];
  select(-1);
  for (const [el, cls] of [[tubeEls[a], "hint-from"], [tubeEls[b], "hint-to"]]) {
    el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls);
    setTimeout(() => el.classList.remove(cls), 1600);
  }
  toast("Pour vial " + (a + 1) + " into vial " + (b + 1) + ".");
});
$("sound").addEventListener("click", () => { G.sound = !G.sound; chrome(); save(); note(523.3, 0, .3, .05); });
$("marks").addEventListener("click", () => { G.marks = !G.marks; chrome(); save(); });
$("prev").addEventListener("click", () => { if (S.level > 1) go(S.level - 1); });
$("next").addEventListener("click", () => { if (S.level < S.max) go(S.level + 1); });
$("nextLevel").addEventListener("click", () => go(S.lost ? S.level : S.level + 1));
$("tabCasual").addEventListener("click", () => { if (G.mode !== "casual") swap(() => { G.mode = "casual"; lbOpen = false; }, -1); });
$("tabComp").addEventListener("click", () => { if (G.mode !== "comp") swap(() => { G.mode = "comp"; }, 1); });
$("tiersBtn").addEventListener("click", () => swap(() => { G.tier = null; lbOpen = false; }));

function start(data) {
  G = (data && Array.isArray(data.comp) ? data : null) || load() || blank();
  current();
  show(false);
}
window.claude?.hot?.snapshot?.(() => G);
if (window.claude?.hot?.ready) window.claude.hot.ready(start);
else start(window.claude?.hot?.data ?? {});
</script>
</body>
